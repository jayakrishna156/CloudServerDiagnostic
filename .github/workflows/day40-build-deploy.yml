name: Day 40 - Build and Deployment

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run automated tests
        run: |
          python -m pytest tests/ -v

      - name: Validate server script
        run: |
          bash -n server_check.sh

      - name: Build deployment package
        run: |
          mkdir -p build
          cp server_check.sh build/
          cp -r tests build/
          cp README.md build/
          find build -type d -name "__pycache__" -prune -exec rm -rf {} +
          find build -type f -name "*.pyc" -delete
          tar -czf cloud-server-diagnostic.tar.gz build/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloud-server-diagnostic
          path: cloud-server-diagnostic.tar.gz

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: cloud-server-diagnostic

      - name: Deploy package
        run: |
          mkdir -p deployment
          tar -xzf cloud-server-diagnostic.tar.gz -C deployment
          echo "Deployment completed successfully!"

      - name: Verify deployment
        run: |
          echo "Deployed files:"
          find deployment -type f
